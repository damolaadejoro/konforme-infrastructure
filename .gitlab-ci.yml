stages:
  - validate
  - plan
  - deploy

variables:
  TF_DIR: terraform

.terraform-base:
  image:
    name: hashicorp/terraform:1.9
    entrypoint: [""]
  before_script:
    - cd ${TF_DIR}
    - terraform init -input=false

# Validate + plan on merge requests
terraform-plan-mr:
  extends: .terraform-base
  stage: validate
  script:
    - terraform validate
    - terraform plan -input=false
  rules:
    - if: $CI_MERGE_REQUEST_IID

# Plan on main (saved as artifact for apply)
terraform-plan:
  extends: .terraform-base
  stage: plan
  script:
    - terraform validate
    - terraform plan -input=false -out=plan.cache
  artifacts:
    paths:
      - ${TF_DIR}/plan.cache
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# Apply on main (uses plan artifact)
terraform-apply:
  extends: .terraform-base
  stage: deploy
  dependencies:
    - terraform-plan
  script:
    - terraform apply -input=false -auto-approve plan.cache
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
