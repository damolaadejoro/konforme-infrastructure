stages:
  - validate
  - deploy

variables:
  TF_DIR: terraform

.terraform-base:
  image:
    name: hashicorp/terraform:1.9
    entrypoint: [""]
  before_script:
    - cd ${TF_DIR}
    - terraform init -input=false

# Validate + plan on merge requests
terraform-plan:
  extends: .terraform-base
  stage: validate
  script:
    - terraform validate
    - terraform plan -input=false
  rules:
    - if: $CI_MERGE_REQUEST_IID

# Apply on main branch
terraform-apply:
  extends: .terraform-base
  stage: deploy
  script:
    - terraform validate
    - terraform plan -input=false -out=plan.cache
    - terraform apply -input=false -auto-approve plan.cache
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
